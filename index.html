<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>What's For Dinner</title>
    <link rel="icon" href="./IMG/Title.png" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Header -->
    <nav
      class="navbar navbar-expand-lg bg-white shadow-sm px-3 px-md-4 py-3 border-bottom"
    >
      <div class="container">
        <div class="d-flex align-items-center gap-3">
          <div
            class="logo-circle d-flex align-items-center justify-content-center rounded-circle text-white shadow"
          >
            <i class="fa-solid fa-utensils fs-5"></i>
          </div>
          <div>
            <h1 class="fs-4 fw-bold text-dark m-0">What's For Dinner</h1>
            <span class="text-secondary small"
              >Your daily meal inspiration</span
            >
          </div>
        </div>

        <button
          class="navbar-toggler border-0 shadow-none px-0"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <i class="fa-solid fa-bars fs-3"></i>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <hr class="nav-divider d-lg-none my-3" />
          <div
            class="navbar-nav flex-lg-row align-items-lg-center gap-1 gap-lg-4 ms-lg-auto"
          >
            <a
              href="#"
              class="nav-icon-link text-decoration-none d-flex align-items-center gap-3 py-2 py-lg-0"
            >
              <span class="icon-box"><i class="fa-solid fa-bookmark"></i></span>
              <span class="d-lg-none fs-6">Saved Recipes</span>
            </a>
            <a
              href="#"
              class="nav-icon-link text-decoration-none d-flex align-items-center gap-3 py-2 py-lg-0"
            >
              <span class="icon-box"
                ><i class="fa-solid fa-clock-rotate-left"></i
              ></span>
              <span class="d-lg-none fs-6">Recent</span>
            </a>
            <a
              href="#"
              class="nav-icon-link text-decoration-none d-flex align-items-center gap-3 py-2 py-lg-0"
            >
              <span class="icon-box"><i class="fa-solid fa-gear"></i></span>
              <span class="d-lg-none fs-6">Settings</span>
            </a>
            <a
              href="#"
              class="nav-icon-link text-decoration-none d-flex align-items-center gap-3 py-2 py-lg-0"
            >
              <span class="icon-box">
                <img
                  src="./IMG/avatar-4.jpg"
                  alt="Profile"
                  class="avatar rounded-circle"
                />
              </span>
              <span class="d-lg-none fs-6">Profile</span>
            </a>
          </div>
        </div>
      </div>
    </nav>
    <!-- Header-->

    <!-- Main card -->
    <main class="container py-4">
      <div class="card recipe-card border-0 shadow overflow-hidden">
        <div class="row g-0">
          <div class="col-lg-5 image-side">
            <img id="recipeImage" src="//" alt="Recipe photo" />
            <span class="rating-badge"
              ><i class="fa-solid fa-star text-warning"></i><b id="rating"></b>
              <small id="reviews" class="text-secondary"></small>
            </span>
            <div class="stats-box shadow">
              <div class="row text-center g-0">
                <div class="col">
                  <i class="fa-solid fa-clock fs-4 orange-i"></i>
                  <small class="d-block text-secondary">Prep Time</small
                  ><b id="prepTime"></b>
                </div>
                <div class="col">
                  <i class="fa-solid fa-fire-burner fs-4 red-i"></i>
                  <small class="d-block text-secondary">Cook Time</small
                  ><b id="cookTime"></b>
                </div>
                <div class="col">
                  <i class="fas fa-users fs-4 blue-i"></i
                  ><small class="d-block text-secondary">Servings</small
                  ><b id="servings"></b>
                </div>
              </div>
            </div>
          </div>

          <div class="col-lg-7 p-4 p-md-5 details-side">
            <div class="d-flex justify-content-between align-items-start gap-3">
              <div>
                <div>
                  <div class="d-flex flex-wrap gap-2 mb-2">
                    <span id="difficultyBadge" class="tag-pill"></span>
                    <span id="cuisineBadge" class="tag-pill tag-cuisine"></span>
                  </div>
                  <h2 id="title" class="fw-bold"></h2>
                  <p id="description" class="text-secondary"></p>
                </div>
              </div>
              <div class="d-flex gap-2">
                <button
                  id="bookmarkBtn"
                  class="btn icon-btn"
                  onclick="toggleBookmark()"
                >
                  <i class="fa-solid fa-bookmark"></i>
                </button>
                <button class="btn icon-btn" onclick="shareRecipe()">
                  <i class="fa-solid fa-share-nodes"></i>
                </button>
              </div>
            </div>

            <div id="timeAlert" class="time-alert d-none" role="alert">
              <i class="fa-solid fa-triangle-exclamation"></i>
              <div>
                <b>Extended Preparation Time</b>
                <div class="fs-14">
                  This recipe requires more than 45 minutes to prepare. Plan
                  accordingly!
                </div>
              </div>
            </div>

            <div class="tabs">
              <button
                class="tab-btn"
                id="tab-ingredients"
                onclick="showTab('ingredients')"
              >
                <i class="fa-solid fa-list-check"></i> Ingredients
              </button>
              <button
                class="tab-btn"
                id="tab-instructions"
                onclick="showTab('instructions')"
              >
                <i class="fa-solid fa-book-open"></i> Instructions
              </button>
              <button
                class="tab-btn"
                id="tab-nutrition"
                onclick="showTab('nutrition')"
              >
                <i class="fa-solid fa-chart-pie"></i> Nutrition
              </button>
              <button class="tab-btn" id="tab-tips" onclick="showTab('tips')">
                <i class="fa-solid fa-lightbulb"></i> Chef's Tips
              </button>
            </div>

            <div id="tabContent" class="tab-content-box"></div>

            <hr class="my-4" />
            <button class="btn btn-try" onclick="newRecipe()">
              <i class="fa-solid fa-rotate me-2"></i> Try Another Recipe
            </button>
          </div>
        </div>
      </div>
    </main>
    <!-- Main card -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/main.js"></script>
  </body>
</html>
